name: build-push

on:
  push:
    branches: [master]
    paths-ignore:
      - docker-compose-local.yaml
  workflow_dispatch:

env:
  IMAGE: sebi123q/sebi-online-schop-api
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Teste
        run: mvn -B test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: sebi123q
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build si push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}

  notify:
    needs: [test, build-push,]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Mesaj pe Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ contains(needs.*.result, 'failure') && ':x: PICAT' || ':white_check_mark: OK' }} *${{ github.repository }}* `${{ needs.build-push.outputs.tag || github.sha }}`\ntest: ${{ needs.test.result }} · build-push: ${{ needs.build-push.result }} · update-compose: ${{ needs.update-compose.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Vezi run-ul>"